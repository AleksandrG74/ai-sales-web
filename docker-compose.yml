version: "3.9"

services:
  # ─── Backend (дирижёр, веб-API, статика) ──────────────────
  backend:
    build: .
    container_name: aisales_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backend/data:/app/backend/data
      - ./sessions:/app/sessions
      - ./configs:/app/configs:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── client-search (работает по расписанию) ──────────────
  client-search:
    build: .
    container_name: aisales_client_search
    restart: unless-stopped
    command: ["python", "client_search/main.py", "--loop", "--mode", "all"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backend/data:/app/backend/data
      - ./sessions:/app/sessions
      - ./configs:/app/configs:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── telegram-bot ─────────────────────────────────────────
  telegram-bot:
    build: .
    container_name: aisales_telegram_bot
    restart: unless-stopped
    command: ["python", "telegram_bot/main.py"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backend/data:/app/backend/data
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: aisales_network
